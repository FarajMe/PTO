<template>
    <template if:true={openSpinner}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>
    <div style="width:350px">
        <div class="round2x slds-m-bottom_medium pr bgw" style="overflow:hidden">
            <div class="slds-grid slds-grid_vertical-align-center" style="border-bottom:1px solid rgb(217, 217, 217);padding:7px;box-shadow: rgba(0, 0, 0, 0.04) 0px 3px 5px;">
                <div class="slds-col slds-size_6-of-12">
                    <div class="fs16 b ">Holidays</div>
                  </div>
                  <div class="slds-col slds-size_6-of-12 slds-text-align_right">
                    <div class="g_nm vm pointer" style="color:#0176D3;padding-right:10px" onclick={handleUpcommingHolidays}>
                        <lightning-icon icon-name='utility:date_input' alternative-text='date_input' size='x-small' title='date_input' class="slds-current-color "></lightning-icon>
                    </div>
                    <div if:true={isAdmin} class="pointer g_nm pr vm" style="width:30px;height:30px;background:#0176D3;border-radius:50%;color:white;margin-top:3px;" onclick={handleOpenModalAddHoliday}>
                        <div style="position: absolute;top: 45%;left: 50%;translate: -50% -50% 0px;">
                            <lightning-icon icon-name='utility:add' alternative-text='add' size='xx-small' title='add' class="slds-current-color "></lightning-icon>
                        </div>
                        <div class="ov" style="background:transparent;border-radius:50%;" onclick={handleOpenModalAddHoliday}></div>
                    </div>
                  </div>
            </div>
            <div class="slds-grid slds-grid_vertical-align-center" style="padding:12px 20px 12px;">
                <div class="slds-col slds-size_2-of-12" >
                    <div class="g_nm vm slds-m-right_xx-small pr pointer "  style="width:25px;height:25px;border-radius:5px;background:#0176D326" >
                        <div style="position: absolute;top: 45%;left: 50%;translate: -50% -50% 0px;color:#0176D3">
                            <lightning-icon icon-name='utility:chevronleft' alternative-text='chevronleft' size='xx-small' title='chevronleft' class="slds-current-color " ></lightning-icon>
                        </div>
                        <div class="ov" style="background:transparent" data-id="calendar-prev"  onclick={handleChangeMonth}></div>
                    </div>
                  </div>
                  <div class="slds-col slds-size_8-of-12 slds-text-align_center" >
                    <div class="fs16 b ">{currentDate}</div>
                  </div>
                  <div class="slds-col slds-size_2-of-12 slds-text-align_right" >
                    <div class="g_nm vm pr pointer "  style="width:25px;height:25px;border-radius:5px;background:#0176D326;color:#0176D3" >
                        <div style="position: absolute;top: 45%;left: 50%;translate: -50% -50% 0px;">
                            <lightning-icon icon-name='utility:chevronright' alternative-text='chevronright' size='xx-small' title='chevronright' class="slds-current-color " ></lightning-icon>
                        </div>
                        <div class="ov" style="background:transparent" data-id="calendar-next"  onclick={handleChangeMonth}></div>
                    </div>
                  </div>
            </div>

                <div class="calendar-weekdays fs0" style="font-weight: 500;text-align:center;margin-bottom:3px">

            <div class="calendar-body" style="min-height:300px"> 
                <div class="calendar-weekdays fs0" style="font-weight: 500;text-align:center">
                    <div class="w14 g_nm fs14">Sun</div>
                    <div class="w14 g_nm fs14">Mon</div>
                    <div class="w14 g_nm fs14">Tue</div>
                    <div class="w14 g_nm fs14">Wed</div>
                    <div class="w14 g_nm fs14">Thu</div>
                    <div class="w14 g_nm fs14">Fri</div>
                    <div class="w14 g_nm fs14">Sat</div>
                </div>
                <div class=" calendar-dates fs0" >
                    <div for:each={calenderDates} for:item="calender" for:index="index" key={calender}   class="pr g_nm w14" style="padding-top:23px;padding-bottom:23px;text-align:center;">
                        <div class={calender.parentClasses}  >
                            <div class="cc fs14" >{calender.nb}</div>
                            <div for:each={calender.holidays} for:item="holiday" key={holiday} class={holiday.class} style={holiday.style} ></div>
                        </div>
                        <div class="ov" style="background:transparent" onclick={handleChangeDay} data-full={calender.full} data-nb={calender.nb} data-weekend={calender.weekend} data-open={calender.openDates} data-holiday={calender.holiday}></div>
                    </div>
                </div>
            </div>
            <div if:true={showAllHolidays}  class="bgw slds-p-around_xx-small pr" style="border-top:1px solid rgb(217, 217, 217);border-bottom-left-radius:.5 rem;border-bottom-right-radius:.5 rem ;height:200px;overflow-y: scroll;">
                <div >
                    <div class="b fs14" style="color:#9CA2AB">{holidayText}</div>
                    <div if:false={noHolidays} for:each={holidaysCards} for:item="eachHolidayCard" data-key={eachHolidayCard.ids} key={eachHolidayCard.ids} class="slds-m-top_xx-small" style="border-left:2px solid #0176D3;border-top:1px solid #D9D9D9;border-right:1px solid #D9D9D9;border-bottom:1px solid #D9D9D9;border-radius:5px">
                        <div  class="slds-grid slds-grid_vertical-align-center slds-wrap slds-p-around_xx-small " >
                            <div class="slds-col slds-size_8-of-12 slds-text-align_left ">
                                <div class="g_nm vt ">
                                    <div class="b fs14 pointer"  >
                                        {eachHolidayCard.title} 
                                    </div>
                                    <div class="fs12 slds-p-top_xxx-small">{eachHolidayCard.start} -- {eachHolidayCard.end}</div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_4-of-12  b slds-text-align_right" style="color:#9CA2AB">
                                <div if:true={isAdmin}>
                                    <div class="g_nm">
                                        <lightning-icon icon-name='utility:edit' alternative-text='edit' size='xx-small' title='edit' class="slds-current-color pointer" onclick={handleOpenModalEditHoliday} data-key={eachHolidayCard.ids} data-title={eachHolidayCard.title} data-start={eachHolidayCard.start}></lightning-icon>
                                   </div>
                                   <div class="g_nm slds-p-left_x-small">
                                        <lightning-icon icon-name='utility:delete' alternative-text='delete' size='xx-small' title='delete' class="slds-current-color pointer" onclick={removeHoliday} value={eachHolidayCard.ids} data-start={eachHolidayCard.start}></lightning-icon>
                                    </div>
                                </div>
            
                            </div>
                        </div>
                    </div>
                    <div if:true={noHolidays} class="cc b" style="position: absolute;top: 45%;left: 50%;translate: -50% -50% 0px;">
                        No Holidays
                    </div>
                </div> 
            </div>
        </div>
    </div>
    <template if:true={openAddModal}>
        <div data-modal="ecustommodal" class="emodalclass" >
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open" >
                <div class="slds-modal__container " style="width:500px">
                    <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-p-around_small bgw" style="border-bottom:1px solid #D9D9D9;border-top-left-radius:0.25rem;border-top-right-radius:0.25rem">
                        <div class="slds-col slds-size_1-of-2 slds-text-align_left " >
                            <div class="fs20 b">Add Holiday</div>
                        </div>
                        <div class="slds-col slds-size_1-of-2  b slds-text-align_right" >
                            <div class="g_nm pointer" style="width:30px;height:30px;border-radius:50%;background:#F0F1F3;position:relative;top:2px" onclick={handleCloseModal}>
                                <div style="position: absolute;top: 45%;left: 50%;translate: -50% -50% 0px;">
                                    <lightning-icon icon-name='utility:close' alternative-text='close'  size='x-small' class="slds-current-color " title='close' ></lightning-icon>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div style="padding-bottom:10px">
                            <lightning-input label="Title" name="title" type="text" required onchange={handleGetInputsValues}></lightning-input>
                        </div>
                        <div class="fs0" style="margin:-10px">
                            <div class="g_nm fs14 w50 " style="padding:10px" >
                                <div>
                                    <lightning-input label="Start Date" name="startDate" type="date" value={showDateInAddModal} required onchange={handleGetInputsValues}></lightning-input>
                                </div>
                            </div>
                            <div class="g_nm fs14 w50 " style="padding:10px" >
                                <div>
                                    <lightning-input label="Number of days" name="numberDays" type="text" value="1" required onchange={handleGetInputsValues}></lightning-input>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bgw  slds-text-align_right slds-p-top_large slds-p-horizontal_small slds-p-bottom_small" style="border-bottom-left-radius:0.25rem;border-bottom-right-radius:0.25rem">
                        <lightning-button label="Close" title="Close" icon-name="utility:close" onclick={handleCloseModal}></lightning-button>
                        <lightning-button label="add" title="add" variant="brand" icon-name="utility:save" onclick={handleSaveHoliday} class="slds-p-left_x-small"></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
    </template>
    <template if:true={openEditModal}>
        <div data-modal="ecustommodal" class="emodalclass" >
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open" >
                <div class="slds-modal__container " style="width:500px">
                    <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-p-around_small bgw" style="border-bottom:1px solid #D9D9D9;border-top-left-radius:0.25rem;border-top-right-radius:0.25rem">
                        <div class="slds-col slds-size_1-of-2 slds-text-align_left " >
                            <div class="fs20 b">Update Holiday</div>
                        </div>
                        <div class="slds-col slds-size_1-of-2  b slds-text-align_right" >
                            <div class="g_nm pointer" style="width:30px;height:30px;border-radius:50%;background:#F0F1F3;position:relative;top:2px" onclick={handleCloseModal}>
                                <div style="position: absolute;top: 45%;left: 50%;translate: -50% -50% 0px;">
                                    <lightning-icon icon-name='utility:close' alternative-text='close'  size='x-small' class="slds-current-color " title='close' ></lightning-icon>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div style="padding-bottom:10px">
                            <lightning-input label="Title" name="title" type="text" required onchange={handleGetInputsValues}
                            value={title}></lightning-input>
                        </div>
                        <div class="fs0" style="margin:-10px">
                            <div class="g_nm fs14 w50 " style="padding:10px" >
                                <div>
                                    <lightning-input label="Start Date" name="startDate" type="date" required
                                    value={startDate} onchange={handleGetInputsValues}></lightning-input>
                                </div>
                            </div>
                            <div class="g_nm fs14 w50 " style="padding:10px" >
                                <div>
                                    <lightning-input label="Number of days" name="numberDays" type="text" value="1" required onchange={handleGetInputsValues}></lightning-input>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bgw  slds-text-align_right slds-p-top_large slds-p-horizontal_small slds-p-bottom_small" style="border-bottom-left-radius:0.25rem;border-bottom-right-radius:0.25rem">
                        <lightning-button label="Close" title="Close" icon-name="utility:close" onclick={handleCloseModal}></lightning-button>
                        <lightning-button label="Update" title="Update" variant="brand" icon-name="utility:save" onclick={handleUpdateHoliday} class="slds-p-left_x-small"></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
    </template>
</template>
